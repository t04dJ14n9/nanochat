# Conda environment for nanochat on Huawei Ascend 910B NPU
#
# NOTE: conda env create with mixed pip deps can hang on repodata resolve.
# Use the recommended conda + pip approach below instead.
#
# Recommended setup:
#   source /usr/local/Ascend/ascend-toolkit/set_env.sh
#   conda create -n nanochat-npu python=3.9 -y
#   conda activate nanochat-npu
#   pip install -r requirements_npu.txt
#
# Prerequisites:
#   - CANN toolkit installed (e.g. /usr/local/Ascend/ascend-toolkit)
#   - Ascend driver and firmware installed
#   - Source CANN env: source /usr/local/Ascend/ascend-toolkit/set_env.sh
#
# The torch_npu version MUST match your CANN version exactly.
# Edit requirements_npu.txt before pip install if your CANN version differs.
# See: https://www.hiascend.com/document/detail/zh/Pytorch/600/configandinstg/instg/insg_0006.html
#
# Version compatibility:
#   CANN 8.0.RCx (e.g. 8.0.T13) → torch==2.1.0 + torch-npu==2.1.0.post10
#   CANN 8.1.RCx               → torch==2.3.1 + torch-npu==2.3.1.postX
#   CANN 8.x                   → torch==2.5.1 + torch-npu==2.5.1.postX
